name: "AI Code Review"
description: "Uruchamia agenta code-review (packages/code-reviewer) i zwraca werdykt oraz treść komentarza."

inputs:
  pr-title:
    description: "Tytuł pull requesta."
    required: true
  pr-body-file:
    description: "Ścieżka do pliku z opisem pull requesta."
    required: true
  pr-diff-file:
    description: "Ścieżka do pliku z git diffem pull requesta."
    required: true
  openrouter-api-key:
    description: "Klucz API OpenRouter."
    required: true
  openrouter-model:
    description: "Override modelu OpenRouter (domyślnie openai/gpt-4o-mini)."
    required: false

outputs:
  verdict:
    description: "Werdykt recenzji: pass lub fail."
    value: ${{ steps.run-review.outputs.verdict }}
  comment-body:
    description: "Treść komentarza markdown do opublikowania na PR-ze."
    value: ${{ steps.run-review.outputs.comment-body }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Zainstaluj zależności pakietu code-reviewer
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci

    - name: Uruchom recenzję
      id: run-review
      shell: bash
      working-directory: packages/code-reviewer
      run: npx tsx src/review.ts
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY_FILE: ${{ inputs.pr-body-file }}
        PR_DIFF_FILE: ${{ inputs.pr-diff-file }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
