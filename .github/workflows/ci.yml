name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/code-reviewer
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npx supabase start
      - name: Write .env.test (local Supabase stack, no secrets)
        run: |
          cat > .env.test <<'EOF'
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          EOF
      - run: npm run test
      - name: Create e2e test account
        run: |
          SERVICE_ROLE_KEY=$(npx supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          HTTP_CODE=$(curl -s -o /tmp/create-user.json -w '%{http_code}' -X POST 'http://127.0.0.1:54321/auth/v1/admin/users' \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e-test@example.com","password":"TestPassword123","email_confirm":true}')
          cat /tmp/create-user.json
          # 201 = created, 422 email_exists = already provisioned (e.g. reused runner) — both fine.
          if [ "$HTTP_CODE" != "201" ] && ! grep -q email_exists /tmp/create-user.json; then
            echo "Failed to create e2e test account (HTTP $HTTP_CODE)" >&2
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: npm run typecheck --prefix packages/code-reviewer
      - run: npm test --prefix packages/code-reviewer
